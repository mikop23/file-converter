name: Windows exe 빌드

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: 중계 서버 테스트
        run: node server/test.mjs

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 부품 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: pandoc 포함 (md/html/txt 변환용)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R jgm/pandoc --pattern "*windows-x86_64.zip" -O pandoc.zip
          Expand-Archive pandoc.zip -DestinationPath pandoc_tmp
          New-Item -ItemType Directory -Force bin | Out-Null
          Get-ChildItem pandoc_tmp -Recurse -Filter pandoc.exe | Select-Object -First 1 | Copy-Item -Destination bin\pandoc.exe

      - name: AI 엔진 포함 (llama.cpp, 내 PC에서 돌리는 AI)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releases = gh api "repos/ggml-org/llama.cpp/releases?per_page=30" | ConvertFrom-Json
          $pick = $null; $tag = $null
          foreach ($r in $releases) {
            $win = $r.assets.name | Where-Object { $_ -match 'win' -and $_ -match 'x64' -and $_ -match '\.zip$' -and $_ -notmatch 'cuda|cudart|vulkan|hip|sycl|opencl|arm|kompute' }
            $c = ($win | Where-Object { $_ -match 'cpu' } | Select-Object -First 1)
            if (!$c) { $c = ($win | Where-Object { $_ -match 'avx2' } | Select-Object -First 1) }
            if ($c) { $pick = $c; $tag = $r.tag_name; break }
          }
          if (!$pick) { Write-Host "::error::llama.cpp 윈도우 파일 못 찾음 (최근 릴리스: $(($releases | Select-Object -First 3).tag_name -join ', '))"; exit 1 }
          Write-Host "::notice::llama.cpp 사용 파일: $tag / $pick"
          gh release download $tag -R ggml-org/llama.cpp --pattern $pick -O llama.zip
          Expand-Archive llama.zip -DestinationPath llama_tmp
          $srv = Get-ChildItem llama_tmp -Recurse -Filter llama-server.exe | Select-Object -First 1
          if (!$srv) { Write-Host "::error::$pick 안에 llama-server.exe 없음"; exit 1 }
          New-Item -ItemType Directory -Force bin\llama | Out-Null
          Copy-Item "$($srv.DirectoryName)\*.dll" bin\llama\
          Copy-Item $srv.FullName bin\llama\

      - name: 기본 온라인 AI 주소 넣기
        shell: pwsh
        env:
          RELAY_URL: ${{ vars.RELAY_URL }}
        run: |
          @{ relay_url = "$env:RELAY_URL" } | ConvertTo-Json | Set-Content -Encoding utf8 edition.json
          Get-Content edition.json
          if (!$env:RELAY_URL) { Write-Host "::notice::RELAY_URL 변수가 없어요. 온라인 AI는 프로그램의 ⚙ 설정에서 주소를 넣으면 써요." }

      - name: exe 만들기
        shell: pwsh
        run: |
          $pa = @("--noconfirm", "--windowed", "--name", "FileConverter",
                    "--add-binary", "bin\pandoc.exe;bin", "--add-data", "edition.json;.")
          $pa += @("--add-data", "bin\llama;bin\llama")
          pyinstaller @pa app.py

      - name: 실행 테스트 (부품 다 들어갔는지)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -c "import app, fconv, fai, relay, docx, pptx, pypdfium2, pdf2docx; print('imports ok')"
          if (!(Test-Path dist\FileConverter\FileConverter.exe)) { exit 1 }
          if (!(Test-Path dist\FileConverter\_internal\bin\pandoc.exe)) { exit 1 }
          if (!(Test-Path dist\FileConverter\_internal\edition.json)) { exit 1 }
          if (!(Test-Path dist\FileConverter\_internal\bin\llama\llama-server.exe)) { exit 1 }

      - name: AI 모델 캐시
        uses: actions/cache@v5
        with:
          path: model
          key: qwen2.5-1.5b-q4km

      - name: 진짜 AI로 말 알아듣기 테스트
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force model | Out-Null
          if (!(Test-Path model\m.gguf)) { curl.exe -L -o model\m.gguf https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf }
          $p = Start-Process bin\llama\llama-server.exe -ArgumentList "-m model\m.gguf --port 18080 -c 4096" -PassThru -WindowStyle Hidden
          for ($i = 0; $i -lt 60; $i++) { try { Invoke-WebRequest http://127.0.0.1:18080/health -UseBasicParsing | Out-Null; break } catch { Start-Sleep 2 } }
          $env:PYTHONIOENCODING = "utf-8"
          python tests\ai_test.py
          Stop-Process $p

      - name: 압축
        shell: pwsh
        run: |
          Copy-Item 설명서.txt dist\FileConverter\
          Compress-Archive dist\FileConverter\* FileConverter-windows.zip

      - uses: actions/upload-artifact@v5
        with:
          name: FileConverter-windows
          path: FileConverter-windows.zip

      - name: 배포 페이지(Release)에 올리기
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FileConverter-windows.zip
